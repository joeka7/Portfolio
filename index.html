<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Youssef Karam — Full-Stack Web Developer</title>
<meta name="description" content="Full-stack web developer based in Cairo. Custom WordPress themes, WooCommerce storefronts, and performance-tuned front-ends that ship." />
<link rel="stylesheet" href="./styles.css" />
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="./_ds_bundle.js"></script>
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg-base); color: var(--text-body); font-family: var(--font-sans); overflow-x: hidden; }
  ::selection { background: rgba(255,255,255,0.18); color: var(--white); }
  ::-webkit-scrollbar { width: 11px; }
  ::-webkit-scrollbar-track { background: var(--bg-floor); }
  ::-webkit-scrollbar-thumb { background: var(--ink-600); border-radius: 999px; border: 3px solid var(--bg-floor); }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-500); }

  /* custom cursor */
  #cursor-dot, #cursor-ring { position: fixed; top: 0; left: 0; border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); mix-blend-mode: difference; }
  #cursor-dot { width: 7px; height: 7px; background: #fff; }
  #cursor-ring { width: 36px; height: 36px; border: 1px solid rgba(255,255,255,0.6); transition: width .25s cubic-bezier(.22,1,.36,1), height .25s cubic-bezier(.22,1,.36,1), background .25s; }
  #cursor-ring.hot { width: 56px; height: 56px; background: rgba(255,255,255,0.08); }
  @media (hover: none), (max-width: 820px) { #cursor-dot, #cursor-ring { display: none; } }

  /* responsive */
  @media (max-width: 980px) {
    .hero-grid { grid-template-columns: 1fr !important; }
    .hero-aside { display: none !important; }
    .about-grid, .contact-grid, .cs-grid { grid-template-columns: 1fr !important; }
    .skills-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .work-grid { grid-template-columns: 1fr !important; }
    .work-grid > * { grid-column: auto !important; }
  }
  @media (max-width: 760px) {
    .nav-links, .nav-cta { display: none !important; }
    .nav-burger { display: inline-flex !important; }
  }
  @media (max-width: 520px) {
    .skills-grid { grid-template-columns: 1fr !important; }
    .form-row, .approach-row { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>
<div id="cursor-ring"></div>
<div id="cursor-dot"></div>
<div id="root"></div>

<script type="text/babel" src="./js/Icons.jsx"></script>
<script type="text/babel" src="./js/KitShared.jsx"></script>
<script type="text/babel" src="./js/Nav.jsx"></script>
<script type="text/babel" src="./js/Hero.jsx"></script>
<script type="text/babel" src="./js/Work.jsx"></script>
<script type="text/babel" src="./js/About.jsx"></script>
<script type="text/babel" src="./js/Skills.jsx"></script>
<script type="text/babel" src="./js/Contact.jsx"></script>
<script type="text/babel" src="./js/CaseStudy.jsx"></script>

<script type="text/babel" data-presets="react">
  const { useState, useEffect } = React;
  const { Nav, Hero, Work, About, Skills, Experience, Contact, CaseStudy } = window;

  function App() {
    const [project, setProject] = useState(null);

    const navigate = (id) => {
      if (project) { setProject(null); setTimeout(() => scrollTo(id), 60); return; }
      scrollTo(id);
    };
    const scrollTo = (id) => {
      if (id === 'top') { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      const el = document.getElementById(id);
      if (el) window.scrollTo({ top: el.offsetTop - 80, behavior: 'smooth' });
    };
    const openProject = (p) => { setProject(p); };
    const back = () => { setProject(null); setTimeout(() => scrollTo('work'), 50); };

    if (project) {
      return (
        <div style={{ animation: 'ds-fade var(--dur-base) var(--ease-out)' }}>
          <CaseStudy project={project} onBack={back} />
        </div>
      );
    }

    return (
      <div className="ds-body">
        <Nav onNavigate={navigate} />
        <main>
          <Hero onNavigate={navigate} />
          <Work onOpenProject={openProject} />
          <About />
          <Skills />
          <Experience />
          <Contact />
        </main>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  /* ---- custom cursor ---- */
  (function () {
    const dot = document.getElementById('cursor-dot');
    const ring = document.getElementById('cursor-ring');
    let rx = 0, ry = 0, x = 0, y = 0;
    document.addEventListener('mousemove', (e) => {
      x = e.clientX; y = e.clientY;
      dot.style.left = x + 'px'; dot.style.top = y + 'px';
      const hot = e.target.closest('a,button,input,textarea,[role=button]');
      ring.classList.toggle('hot', !!hot);
    });
    (function loop() {
      rx += (x - rx) * 0.18; ry += (y - ry) * 0.18;
      ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
      requestAnimationFrame(loop);
    })();
  })();
</script>
</body>
</html>
